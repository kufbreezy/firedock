services:
  - type: web
    name: firedock
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Force the web UI onto the exact port Render expects
      - key: PORT
        value: "10000"
      - key: WEB_LISTENING_PORT
        value: "10000"
      # Completely disable the pure VNC listener so health-checks cannot hit it
      - key: VNC_LISTENING_PORT
        value: "-1"
      - key: FF_OPEN_URL
        value: "https://www.google.com"
      - key: DARK_MODE
        value: "1"
      - key: WEB_AUDIO
        value: "1"
      - key: WEB_FILE_MANAGER
        value: "1"
      - key: DISPLAY_WIDTH
        value: "1280"
      - key: DISPLAY_HEIGHT
        value: "720"
    healthCheckPath: /
